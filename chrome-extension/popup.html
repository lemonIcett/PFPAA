<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body { font-family: system-ui, sans-serif; width: 240px; padding: 16px; background: #060c1a; color: #c8d3e0; margin: 0; }
    h2 { font-size: 14px; font-weight: 600; color: #fff; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #6b7280; }
    .dot.green { background: #34d399; }
    p { font-size: 12px; color: #6b7280; margin: 0 0 12px; }
    .status { font-size: 12px; padding: 8px 12px; border-radius: 8px; background: #0f1f3a; border: 1px solid #1e3a5a; }
    .connected { border-color: #065f46; background: #022c22; color: #34d399; }
    .disconnected { border-color: #7f1d1d; background: #1f0505; color: #f87171; }
    code { font-size: 10px; background: #0f1f3a; padding: 2px 6px; border-radius: 4px; color: #60a5fa; }
  </style>
</head>
<body>
  <h2><span class="dot" id="dot"></span>PFPA Monitor</h2>
  <p>Browser activity tracker</p>
  <div class="status disconnected" id="status">Connecting to PFPA app...</div>
  <p style="margin-top: 12px; font-size: 11px;">Connects to <code>ws://localhost:7777</code><br>Make sure the PFPA desktop app is running.</p>
  <script src="popup.js"></script>
</body>
</html>
